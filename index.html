// ── audio ──
let audioCtx = null;
let muted = localStorage.getItem('snakeMute') === '1';

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(f0, f1, dur, type, vol) {
  if (muted) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), now + dur);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + dur + 0.02);
}
function sfxEat() {
  tone(540, 880, 0.09, 'square', 0.09);
  setTimeout(() => tone(720, 1100, 0.1, 'square', 0.07), 60);
}
function sfxWall() { tone(220, 70, 0.3, 'sawtooth', 0.16); }

// ── game state ──
let snake, dir, nextDir, food, score, speed, timer, paused, running, high = 0;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; speed = 1;
  placeFood();
  updateUI();
  paused = false; running = true; overlayMode = 'start';
  overlay.classList.add('hidden');
  clearInterval(timer);
  tick();
  ensureAudio();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}

function tick() {
  clearInterval(timer);
  const base = 150 - (speed-1)*8;
  const delay = Math.max(base, 60);
  timer = setInterval(() => { if (!paused) step(); }, delay);
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // wall / self collision
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||
      snake.some(s=>s.x===head.x&&s.y===head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    score += 10;
    sfxEat();
    if (score > high) { high = score; localStorage.setItem('snakeHigh',high); }
    // speed up every 50 pts
    const newSpeed = Math.floor(score/50)+1;
    if (newSpeed !== speed) { speed = newSpeed; tick(); }
    placeFood();
    updateUI();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  // bg
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0,0,C,C);

  // grid (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  for (let i=0;i<=COLS;i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,C); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(C,i*CELL); ctx.stroke();
  }

  // food
  ctx.fillStyle = theme.food;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, Math.PI*2);
  // food glow
  ctx.shadowColor = theme.food; ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  // snake
  const bc = hexToRgb(theme.body);
  snake.forEach((s,i) => {
    if (i === 0) {
      ctx.fillStyle = theme.head;
    } else {
      const tt = i / snake.length;
      const r = Math.max(0, bc.r - tt*60);
      const g = Math.max(0, bc.g - tt*60);
      const b = Math.max(0, bc.b - tt*60);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
    }
    const pad = i===0 ? 1 : 2;
    roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, i===0?5:3);
  });

  // eyes on head
  const h = snake[0];
  ctx.fillStyle = '#111';
  const ex = h.x*CELL+CELL/2, ey = h.y*CELL+CELL/2;
  const ox = dir.x*3, oy = dir.y*3;
  const px = dir.y*4, py = -dir.x*4;
  ctx.beginPath(); ctx.arc(ex+ox+px, ey+oy+py, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex+ox-px, ey+oy-py, 2, 0, Math.PI*2); ctx.fill();
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath(); ctx.fill();
}

function updateUI() {
  scoreEl.textContent = score;
  highEl.textContent  = high;
  speedEl.textContent = speed;
}

function gameOver() {
  running = false;
  overlayMode = 'over';
  clearInterval(timer);
  sfxWall();
  ovTitle.textContent = I18N[lang].gameOver;
  ovMsg.textContent = '';
  ovScore.textContent = I18N[lang].scoreLine.replace('{s}', score).replace('{h}', high);
  ovScore.classList.remove('hidden');
  btn.textContent = I18N[lang].playAgain;
  overlay.classList.remove('hidden');
}

// ── i18n apply ──
function detectLang() {
  const n = (navigator.language || '').toLowerCase();
  if (n.startsWith('zh')) return 'zh-Hant';
  if (n.startsWith('ja')) return 'ja';
  if (n.startsWith('ko')) return 'ko';
  return 'en';
}

function applyLang(l, save) {
  if (!LANG_LIST.includes(l)) l = 'en';
  lang = l;
  const i = I18N[lang];
  document.documentElement.lang = lang;
  document.title = i.title;
  document.querySelector('meta[name="description"]').setAttribute('content', i.desc);
  document.querySelector('meta[name="keywords"]').setAttribute('content', i.keywords);
  document.querySelector('meta[property="og:title"]').setAttribute('content', i.ogTitle);
  document.querySelector('meta[property="og:description"]').setAttribute('content', i.ogDesc);
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', i.ogTitle);
  document.querySelector('meta[name="twitter:description"]').setAttribute('content', i.ogDesc);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (i[k] !== undefined) el.textContent = i[k];
  });
  scoreEl.setAttribute('aria-label', i.scoreLabel);
  highEl.setAttribute('aria-label', i.highLabel);
  speedEl.setAttribute('aria-label', i.speedLabel);
  langSelect.value = lang;
  // 同步覆蓋層文字（按目前狀態）
  if (overlayMode === 'paused') {
    ovTitle.textContent = i.paused;
    ovMsg.textContent = i.pressSpace;
    ovScore.classList.add('hidden');
    btn.textContent = i.continueBtn;
  } else if (overlayMode === 'over') {
    ovTitle.textContent = i.gameOver;
    ovMsg.textContent = '';
    if (typeof score === 'number') ovScore.textContent = i.scoreLine.replace('{s}', score).replace('{h}', high);
    ovScore.classList.remove('hidden');
    btn.textContent = i.playAgain;
  } else {
    ovTitle.textContent = i.titleShort;
    ovMsg.textContent = i.pressEnter;
    ovScore.classList.add('hidden');
    btn.textContent = i.startBtn;
  }
  updateSoundBtn();
  renderThemeButtons();
  if (save) localStorage.setItem('snakeLang', lang);
}

// ── theme / color helpers ──
function saveTheme() {
  localStorage.setItem('snakeColors', JSON.stringify(theme));
  localStorage.setItem('snakeThemeName', currentTheme);
}
function syncColorInputs() {
  headColor.value = theme.head;
  bodyColor.value = theme.body;
  foodColor.value = theme.food;
  bgColor.value   = theme.bg;
}
function setTheme(k) {
  if (THEMES[k]) {
    theme = Object.assign({}, THEMES[k]);
    currentTheme = k;
  } else {
    currentTheme = 'custom';
  }
  syncColorInputs();
  saveTheme();
  renderThemeButtons();
  draw();
}
function bindColorInput(input, key) {
  input.addEventListener('input', () => {
    theme[key] = input.value;
    currentTheme = 'custom';
    saveTheme();
    renderThemeButtons();
    draw();
  });
}
function renderThemeButtons() {
  themeBtns.innerHTML = '';
  Object.keys(THEMES).forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'theme-btn' + (currentTheme === k ? ' active' : '');
    b.title = I18N[lang][THEMES[k].label];
    b.style.background = `linear-gradient(135deg, ${THEMES[k].head} 50%, ${THEMES[k].food} 50%)`;
    b.addEventListener('click', () => setTheme(k));
    themeBtns.appendChild(b);
  });
  // 自訂按鈕
  const cb = document.createElement('button');
  cb.type = 'button';
  cb.className = 'theme-btn' + (currentTheme === 'custom' ? ' active' : '');
  cb.title = I18N[lang].customTheme;
  cb.style.background = `linear-gradient(135deg, ${theme.head} 50%, ${theme.food} 50%)`;
  cb.style.borderColor = currentTheme === 'custom' ? '#fff' : '#555';
  cb.addEventListener('click', () => setTheme('custom'));
  themeBtns.appendChild(cb);
}

// ── sound button ──
function updateSoundBtn() {
  soundBtn.textContent = muted ? '🔇' : '🔊';
  soundBtn.title = muted ? I18N[lang].soundOff : I18N[lang].soundOn;
  soundBtn.setAttribute('aria-label', muted ? I18N[lang].soundOff : I18N[lang].soundOn);
}

// ── input ──
const keyMap = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
};

document.addEventListener('keydown', e => {
  if (!settingsModal.classList.contains('hidden')) {
    if (e.key === 'Escape') settingsModal.classList.add('hidden');
    return;
  }
  if (e.key === 'Enter' && !running) { init(); return; }
  if (e.key === ' ' && running) {
    paused = !paused;
    if (paused) {
      overlayMode = 'paused';
      ovTitle.textContent = I18N[lang].paused;
      ovMsg.textContent = I18N[lang].pressSpace;
      ovScore.classList.add('hidden');
      btn.textContent = I18N[lang].continueBtn;
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
    e.preventDefault(); return;
  }
  if (!running) return;
  const d = keyMap[e.key];
  if (d) {
    // prevent reverse
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    e.preventDefault();
  }
});

btn.addEventListener('click', () => {
  if (paused) { paused=false; overlay.classList.add('hidden'); }
  else init();
});

// ── settings UI ──
settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
closeBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
settingsModal.addEventListener('click', e => {
  if (e.target === settingsModal) settingsModal.classList.add('hidden');
});
langSelect.addEventListener('change', e => applyLang(e.target.value, true));
soundBtn.addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('snakeMute', muted ? '1' : '0');
  updateSoundBtn();
});
bindColorInput(headColor, 'head');
bindColorInput(bodyColor, 'body');
bindColorInput(foodColor, 'food');
bindColorInput(bgColor, 'bg');

// ── mobile touch controls ──
let touchStartX = 0, touchStartY = 0;
cv.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });

cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return; // too small
  let newDir;
  if (absDx > absDy) {
    newDir = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  } else {
    newDir = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  }
  if (newDir.x !== -dir.x || newDir.y !== -dir.y) nextDir = newDir;
  e.preventDefault();
}, { passive: false });

// swipe on overlay buttons too
document.addEventListener('touchstart', e => {
  if (e.target.tagName === 'BUTTON') return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (e.target.tagName === 'BUTTON') return;
  if (!running) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 30) return;
  let newDir;
  if (absDx > absDy) {
    newDir = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  } else {
    newDir = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  }
  if (newDir.x !== -dir.x || newDir.y !== -dir.y) nextDir = newDir;
}, { passive: true });

// ── load saved settings & initialise ──
const savedColors = JSON.parse(localStorage.getItem('snakeColors') || 'null');
if (savedColors) theme = Object.assign({}, DEFAULT_COLORS, savedColors);
currentTheme = localStorage.getItem('snakeThemeName') || 'classic';
if (!THEMES[currentTheme]) currentTheme = 'classic';
if (currentTheme !== 'custom' && THEMES[currentTheme]) theme = Object.assign({}, theme, THEMES[currentTheme]);
muted = localStorage.getItem('snakeMute') === '1';
syncColorInputs();

const qLang = new URLSearchParams(location.search).get('lang');
const storedLang = localStorage.getItem('snakeLang');
let initLang = storedLang || detectLang();
if (qLang && LANG_LIST.includes(qLang)) initLang = qLang;
applyLang(initLang, !qLang);

// high score
high = parseInt(localStorage.getItem('snakeHigh')) || 0;
highEl.textContent = high;

// initial draw
snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
dir = {x:1,y:0}; nextDir = {x:1,y:0};
food = {x:15,y:10}; score=0; speed=1;
overlayMode = 'start';
updateUI(); draw();
</script>
</body>
